name: Deploy Amari Music

permissions:
  contents: read

on:
  push:
    branches: ["main"]
    paths: [ src/**, tests/** ]

  workflow_dispatch:

concurrency:
  group: "amari"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [ self-hosted ]
    name: Deploy Amari Music
    outputs:
      build: ${{ steps.buildid.outputs.formattedTime }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate build number
        id: buildid
        run: |
          $buildTime = (Get-Date).ToUniversalTime().ToString("yyyy.MM.dd-HH.mm")
          echo "formattedTime=$buildTime" >> $env:GITHUB_OUTPUT

      - name: List all changed files
        run: |
          Set-Content -Path C:/deployment-stage/amari-${{ steps.buildid.outputs.formattedTime }}.txt -Value ""
          Add-Content -Path C:/deployment-stage/amari-${{ steps.buildid.outputs.formattedTime }}.txt -Value "Build Results for Amari Music"
          Add-Content -Path C:/deployment-stage/amari-${{ steps.buildid.outputs.formattedTime }}.txt -Value ""
          Add-Content -Path C:/deployment-stage/amari-${{ steps.buildid.outputs.formattedTime }}.txt -Value "Build Number - ${{ steps.buildid.outputs.formattedTime }}"
          Add-Content -Path C:/deployment-stage/amari-${{ steps.buildid.outputs.formattedTime }}.txt -Value "---------------------------------"
          Add-Content -Path C:/deployment-stage/amari-${{ steps.buildid.outputs.formattedTime }}.txt -Value ""
          Add-Content -Path C:/deployment-stage/amari-${{ steps.buildid.outputs.formattedTime }}.txt -Value "Commit Item Messages:"
          Add-Content -Path C:/deployment-stage/amari-${{ steps.buildid.outputs.formattedTime }}.txt -Value "---------------------------------"
          $mergeCommit = git log --format=%B -n 1 HEAD
          Add-Content -Path C:/deployment-stage/amari-${{ steps.buildid.outputs.formattedTime }}.txt -Value $mergeCommit
          $parentCount = (git cat-file -p HEAD | Select-String "^parent").Count
          if ($parentCount -gt 1) {
            Add-Content -Path C:/deployment-stage/amari-${{ steps.buildid.outputs.formattedTime }}.txt -Value ""
            Add-Content -Path C:/deployment-stage/amari-${{ steps.buildid.outputs.formattedTime }}.txt -Value "Included Commits:"
            $prCommits = git log --format="- %s" HEAD^1..HEAD^2
            Add-Content -Path C:/deployment-stage/amari-${{ steps.buildid.outputs.formattedTime }}.txt -Value ($prCommits -join "`n")
          }
          Add-Content -Path C:/deployment-stage/amari-${{ steps.buildid.outputs.formattedTime }}.txt -Value ""
          Add-Content -Path C:/deployment-stage/amari-${{ steps.buildid.outputs.formattedTime }}.txt -Value "Changed Files"
          Add-Content -Path C:/deployment-stage/amari-${{ steps.buildid.outputs.formattedTime }}.txt -Value "---------------------------------"
          Add-Content -Path C:/deployment-stage/amari-${{ steps.buildid.outputs.formattedTime }}.txt -Value $(git diff --name-status HEAD~1..HEAD)

      - name: Test
        run: |
          cd tests/AmariMusic.Tests
          dotnet test --configuration Release

      - name: Verify production config exists and admin credentials are set
        run: |
          $configPath = "C:/www-root/amarimusic.com/appsettings.Production.json"
          if (-not (Test-Path $configPath)) {
            Write-Error "appsettings.Production.json is missing from the server. Deploy aborted."
            exit 1
          }

          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          $adminUser = $config.AdminAuth.Username
          $adminPasswordHash = $config.AdminAuth.PasswordHash
          if ([string]::IsNullOrWhiteSpace($adminUser) -or [string]::IsNullOrWhiteSpace($adminPasswordHash)) {
            Write-Error "AdminAuth:Username / AdminAuth:PasswordHash are not set in appsettings.Production.json. Deploy aborted."
            exit 1
          }

      - name: Create Backup
        run: |
          New-Item -ItemType "directory" -Path "C:/deployment-stage/amari/${{ steps.buildid.outputs.formattedTime }}/" -Force
          Copy-Item C:/www-root/amarimusic.com/* -Destination C:/deployment-stage/amari/${{ steps.buildid.outputs.formattedTime }}/ -Recurse
          Compress-Archive -Path "C:/deployment-stage/amari/${{ steps.buildid.outputs.formattedTime }}/*" -Update -DestinationPath C:/backups/amari-${{ steps.buildid.outputs.formattedTime }}.zip -CompressionLevel "Fastest"
          Remove-Item -Path C:/deployment-stage/amari/${{ steps.buildid.outputs.formattedTime }} -Recurse

      - name: Stop IIS app pool before deploy
        run: |
          Import-Module WebAdministration
          if ((Get-WebAppPoolState -Name "AmariMusic" -ErrorAction SilentlyContinue).Value -eq "Started") {
            Stop-WebAppPool -Name "AmariMusic"
            Start-Sleep -Seconds 3
          }

      - name: Deploy New Code
        run: |
          cd src/AmariMusic.Web
          dotnet publish -c Release -o C:/www-root/amarimusic.com

      - name: Ensure logs directory exists
        run: New-Item -ItemType Directory -Path "C:/www-root/amarimusic.com/logs" -Force

      - name: Start IIS app pool after deploy
        run: |
          Import-Module WebAdministration
          Start-WebAppPool -Name "AmariMusic"

      - name: Email Notification
        run: |
          cd D:/it-tools/mailer
          ./SesMailer.exe --to "David Nuckolls <david.nuckolls@glorykidd.com>" --subject "Amari Music Deploy ${{ steps.buildid.outputs.formattedTime }}" --body C:/deployment-stage/amari-${{ steps.buildid.outputs.formattedTime }}.txt --format text --from-display-name "Amari Music"
